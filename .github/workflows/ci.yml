name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            playwright/package-lock.json

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          TESSDATA_DIR="$(dirname "$(dpkg -L tesseract-ocr-eng | grep '/eng.traineddata$' | head -n 1)")"
          echo "TESSDATA_PREFIX=$TESSDATA_DIR" >> "$GITHUB_ENV"

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

      - name: Build and test
        env:
          TEXTBUDDY_REQUIRE_OCR_TESTS: 'true'
        run: ./gradlew clean test verifyReleaseBundle installerZip

      - name: Install browser test dependencies
        run: |
          npm ci --prefix playwright
          npx --prefix playwright playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm test --prefix playwright

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-reports
          if-no-files-found: ignore
          path: |
            build/reports/**
            build/test-results/**
            frontend/**/test-results/**
            playwright/test-results/**
