plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'gg.jte.gradle' version '3.2.3'
}

group = 'app.textbuddy'
version = '0.0.1-SNAPSHOT'
description = 'Textbuddy writing assistant'

ext {
    jteVersion = '3.2.3'
    languageToolVersion = '6.7'
    kreuzbergVersion = '4.7.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def frontendDir = layout.projectDirectory.dir('frontend')
def frontendBuildDir = layout.buildDirectory.dir('frontend-dist')
def releaseVersion = providers.gradleProperty('releaseVersion').getOrElse(version.toString())

configurations.configureEach {
    // Boot resolves both JAXB implementations to 4.x. Keep GlassFish and the javax API
    // used by LanguageTool's segment dependency, and avoid duplicate JAR names.
    exclude group: 'com.sun.xml.bind', module: 'jaxb-core'
    exclude group: 'com.sun.xml.bind', module: 'jaxb-impl'
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.5')
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.0.5')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation "org.languagetool:languagetool-core:${languageToolVersion}"
    implementation "org.languagetool:language-de:${languageToolVersion}"
    implementation "org.languagetool:language-en:${languageToolVersion}"
    implementation "org.languagetool:language-fr:${languageToolVersion}"
    implementation "org.languagetool:language-it:${languageToolVersion}"
    implementation "dev.kreuzberg:kreuzberg:${kreuzbergVersion}"
    implementation "gg.jte:jte-spring-boot-starter-4:${jteVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += '-Xlint:deprecation'
}

jte {
    generate()
}

tasks.register('npmInstallFrontend', Exec) {
    workingDir frontendDir.asFile
    commandLine 'npm', 'ci'

    inputs.files(
            frontendDir.file('package.json'),
            frontendDir.file('package-lock.json')
    )
    outputs.dir frontendDir.dir('node_modules')
}

tasks.register('buildFrontend', Exec) {
    dependsOn 'npmInstallFrontend'
    workingDir frontendDir.asFile
    commandLine 'npm', 'run', 'build'

    inputs.files(
            frontendDir.file('package.json'),
            frontendDir.file('package-lock.json'),
            frontendDir.file('tsconfig.json'),
            frontendDir.file('vite.config.ts')
    )
    inputs.dir frontendDir.dir('src')
    outputs.dir frontendBuildDir
}

tasks.register('testFrontendUnit', Exec) {
    dependsOn 'npmInstallFrontend'
    workingDir frontendDir.asFile
    commandLine 'npm', 'run', 'test:unit'

    inputs.files(
            frontendDir.file('package.json'),
            frontendDir.file('package-lock.json'),
            frontendDir.file('tsconfig.json')
    )
    inputs.dir frontendDir.dir('src')
}

tasks.named('processResources') {
    from(tasks.named('buildFrontend')) {
        into 'static/editor'
    }
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

def bootArtifact = tasks.named('bootJar') {
    archiveFileName = 'textbuddy.jar'
}

tasks.register('installerZip', Zip) {
    from(bootArtifact)
    from('README.md', 'LICENSE')
    from('docs') {
        into 'docs'
    }
    from('config/examples') {
        into 'config/examples'
    }
    from('distribution/bin') {
        into 'bin'
        filesMatching('*.sh') {
            permissions { unix('rwxr-xr-x') }
        }
    }
    destinationDirectory = layout.buildDirectory.dir('distributions')
    archiveFileName = "textbuddy-${releaseVersion}.zip"
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

tasks.named('test') {
    dependsOn 'testFrontendUnit'
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxHeapSize = '2g'
    inputs.file('distribution/bin/start-textbuddy.sh')
    inputs.files(providers.environmentVariable('TESSDATA_PREFIX').map { directory ->
        ['deu', 'eng'].collect { language -> file("${directory}/${language}.traineddata") }
    }.orElse([]))
}
